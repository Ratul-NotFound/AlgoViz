<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Modern Vibrant Gradient -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="bgTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Squircle Base -->
  <rect width="40" height="40" rx="10" fill="url(#bgTile)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />

  <!-- Clean Flow X Glyph -->
  <!-- Forward Slash Wave Ribbon -->
  <path
    d="M10 30 C 13 30, 17 24, 20 20 C 23 16, 27 10, 30 10"
    stroke="url(#flowGrad1)"
    stroke-width="4.2"
    stroke-linecap="round"
  />

  <!-- Backward Slash Wave Ribbon -->
  <path
    d="M10 10 C 13 10, 17 16, 20 20 C 23 24, 27 30, 30 30"
    stroke="url(#flowGrad2)"
    stroke-width="4.2"
    stroke-linecap="round"
  />

  <!-- Central Spark Node -->
  <circle cx="20" cy="20" r="2.2" fill="#ffffff" />
</svg>